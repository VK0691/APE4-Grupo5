<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RegistraUX – Prototipo v1</title>
  <meta name="description" content="Prototipo navegable v1 para registrar evaluaciones UX (APE 4, IHC, FISEI-UTA).">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-version="v1">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="barra">
    <a class="marca" href="#/inicio" aria-label="RegistraUX, ir al inicio">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <rect x="1.5" y="1.5" width="25" height="25" rx="5" fill="#0B5E63"/>
        <rect x="6" y="15" width="3" height="6" rx="1" fill="#fff"/>
        <rect x="11" y="11" width="3" height="10" rx="1" fill="#fff"/>
        <rect x="16" y="8" width="3" height="13" rx="1" fill="#fff"/>
        <path d="M19 9.5l2 2 3.5-4.5" fill="none" stroke="#FFD24D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      RegistraUX <small>v1</small>
    </a>
    <nav class="nav" aria-label="Principal">
      <ul>
        <li><a href="#/inicio" data-nav="inicio">Inicio</a></li>
        <li><a href="#/evaluaciones" data-nav="evaluaciones">Mis evaluaciones</a></li>
        <li><a href="#/ayuda" data-nav="ayuda">Ayuda</a></li>
      </ul>
    </nav>
    <p id="estado-borrador" class="borrador" aria-live="polite"></p>
  </header>

  <main id="contenido" tabindex="-1">
    <noscript><p>Este prototipo necesita JavaScript activado.</p></noscript>
  </main>

  <p class="pie">Prototipo académico de IHC (APE 4). Los datos son simulados y se guardan solo en este navegador.</p>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <dialog id="dialogo" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <div class="dialogo__cuerpo">
      <h2 id="dialogo-titulo"></h2>
      <p id="dialogo-texto"></p>
      <div class="acciones acciones--fin" id="dialogo-acciones"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
